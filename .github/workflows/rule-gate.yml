name: rule-gate

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

jobs:
  merge-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ../requirements.txt
      - name: Detection-rule merge gate (Sigma file + false-positive case + runbook per rule)
        run: python -m app.rule_gate
      - name: pytest
        run: python -m pytest -q
